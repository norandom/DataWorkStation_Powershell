name: PowerShell Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - ".pre-commit-config.yaml"
      - ".github/workflows/powershell-lint.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - ".pre-commit-config.yaml"
      - ".github/workflows/powershell-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -Repository PSGallery -TrustRepository -Quiet
      - name: Lint tracked PowerShell files
        shell: pwsh
        run: ./scripts/Invoke-PowerShellLint.ps1
