name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  documentation-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -Repository PSGallery -TrustRepository -Quiet
      - name: Run PowerShell and Tricky publication gates
        shell: pwsh
        run: |
          ./scripts/Invoke-PowerShellLint.ps1
          ./scripts/Invoke-Tricky.ps1 capabilities | Out-Null
          $capabilities = ./scripts/Invoke-Tricky.ps1 capabilities -Json | ConvertFrom-Json
          if (@($capabilities.Capabilities).Count -eq 0) { throw 'Tricky JSON capability smoke returned no routes.' }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Build documentation
        run: uv run --locked --group docs mkdocs build --strict --site-dir site
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          tar -C site -czf "dist/DataWorkStation-PowerShell-${version}-site.tar.gz" .
          tar -czf "dist/DataWorkStation-PowerShell-${version}-docs-source.tar.gz" \
            docs mkdocs.yml pyproject.toml uv.lock README.md CHANGELOG.md VERSION
      - name: Create or verify the draft release, upload once, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
            test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
            while IFS= read -r asset; do
              test "$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")" = "0"
            done < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          while IFS= read -r asset; do
            test "$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")" = "1"
          done < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
