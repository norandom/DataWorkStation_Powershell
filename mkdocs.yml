site_name: DataWorkStation PowerShell
site_description: Human- and AI-operable Windows engineering workstation
site_url: https://norandom.github.io/DataWorkStation_Powershell/
repo_url: https://github.com/norandom/DataWorkStation_Powershell
repo_name: norandom/DataWorkStation_Powershell
edit_uri: edit/main/docs/
copyright: DataWorkStation PowerShell

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Start:
      - Install and verify: getting-started.md
      - Choose desired state: desired-state.md
      - Select modules and dependencies: workstation-modules.md
      - Review and run updates: workstation-update.md
  - Configure:
      - Contour Terminal and BlueTerm: contour-terminal.md
      - Terminal keys and scrolling: terminal-keybindings.md
      - Native awk and sed: native-text-tools.md
      - Reproducible NixOS WSL tools: nixos-wsl.md
  - Diagnose:
      - Choose a capability: capabilities/index.md
      - Something is not working: workflows/problem-not-working.md
      - Memory pressure: workflows/memory-pressure.md
      - Network path: workflows/network-path.md
      - Crash without an error: workflows/crash-without-error.md
      - Performance profiling: workflows/performance-profiling.md
      - Keep evidence in Tricky cases: tricky.md
  - Secure:
      - Analyze a suspicious file: malware-analysis.md
      - Compare behavior and binary graphs: analysis-differencing.md
      - Verify an EWF image: ewf-verification.md
      - Manage native forensic tools: forensic-tools.md
      - Autopsy Windows forensic workstation: autopsy.md
      - Verify NixOS integrity: nixos-integrity.md
      - Apply the hardening profile: hardening.md
      - Run opt-in debloat: debloat.md
  - Extend:
      - Human and AI contract: architecture/humans-and-ai.md
      - Codex skills: skills.md
      - Improve one skill safely: workflows/skill-optimization.md
      - Specification-driven development: spec-driven-development.md
  - Reference:
      - Commands and aliases: Aliases.md
      - Sample outputs: sample-outputs.md
      - Releases and Pages: releases.md
