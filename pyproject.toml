[project]
name = "dataworkstation-powershell-docs"
version = "1.0.0"
description = "Documentation toolchain for the DataWorkStation PowerShell environment"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material==9.7.7",
]
lint = [
    "ruff==0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S603", # subprocess calls use fixed argument arrays and shell=False by policy
    "S607", # reviewed system executables may intentionally use PATH
]
