[requirements.REQ-006]
verification = "manual"
rationale = "Run focused Test commands for package, privileged Windows, WSL, and user resources; compare relevant state before and after, and do not authorize Ensure or repair."

[requirements.REQ-007]
verification = "manual"
rationale = "On a disposable or approved already-compliant host, run the same focused Ensure command twice and retain the second report showing no replacement or additional change."

[requirements.REQ-008]
verification = "manual"
rationale = "After explicitly approving one supported Reinitialize on a disposable host, verify its dated backup or snapshot exists and is readable before the first replacement operation."

