[requirements.REQ-018]
verification = "manual"
rationale = "Run Set-DebloatState.ps1 -Mode Test through the documented elevated boundary, compare every proposed AppX target with ProtectedAppxPatterns and NonRemovable state, and do not authorize removal."

[requirements.REQ-019]
verification = "manual"
rationale = "On a disposable host only, explicitly approve Debloat Ensure with ConfirmRemoval and retain timestamps proving the JSON pre-removal snapshot was readable before the first package or feature removal."

[requirements.REQ-020]
verification = "manual"
rationale = "During an explicitly approved Contour Ensure, retain evidence that the Scoop package was removed before the hash-verified official MSI was installed and that no restart occurred."

[requirements.REQ-021]
verification = "manual"
rationale = "Run Set-ContourTerminalState.ps1 -Mode Test on separately approved hosts that already exhibit working and failing graphics stacks; retain bounded gate and driver/INF output without changing a driver for the test."

[requirements.REQ-022]
verification = "manual"
rationale = "After an approved NativeTextTools Test or Ensure, resolve awk.exe and sed.exe, run their functional pipelines, and inventory packages and PATH to confirm Git Bash, MinGit, MSYS, MSYS2, and Cygwin were not introduced."

[requirements.REQ-023]
verification = "manual"
rationale = "Run the focused LinuxHomebrew, LinuxAutomation, and DeveloperTools Test commands, then inspect brew, uv, pyinfra, and Dagger paths from inside the selected Debian WSL distribution."

[requirements.REQ-024]
verification = "manual"
rationale = "Before and after an approved tool Ensure, inventory the host and Debian uv tool directories plus the unrelated AMD/PyTorch environment and verify only the declared isolated environment changed."

