[requirements.REQ-035]
verification = "manual"
rationale = "Build and review the operator documentation for commands, outputs, privileges, rollback, and attack surface."

[requirements.REQ-036]
verification = "manual"
rationale = "Review command-changing commits for matching capability catalog and operator documentation updates."

[requirements.REQ-037]
verification = "manual"
rationale = "Run the declared publication commands and retain their zero-error output before a release is published."

[requirements.REQ-038]
verification = "manual"
rationale = "Test the released bundle state in both PowerShell runtimes and inspect its version and hash declarations."

[requirements.REQ-039]
verification = "manual"
rationale = "Run deterministic plan validation and inspect that every requirement has one accepted verification entry."

[requirements.REQ-040]
verification = "manual"
rationale = "Review generated behavior tasks for a requirement identifier, selector, and preceding failing-test task."

[requirements.REQ-041]
