[requirements.REQ-015]
verification = "manual"
rationale = "On a disposable Windows host, run the approved Windows-feature Ensure, retain its RestartRequired report, and verify the process neither invokes a restart command nor reboots the host."

[requirements.REQ-016]
verification = "automated"
tests = ["tests/Test-WorkstationBaseline.ps1#WindowsSafety"]

[requirements.REQ-017]
