tests = ["tests/Test-WorkstationBaseline.ps1#ModulePlanning", "tests/Test-WorkstationBaseline.ps1#StateSafety"]

[requirements.REQ-010]
verification = "manual"
rationale = "Invoke each destructive module with Ensure but without its confirmation switch, verify a nonzero refusal, and confirm its documented inventory or retained-data target is unchanged."

